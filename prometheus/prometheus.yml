global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateaway_service'
    static_configs:
      - targets: ['gateaway_service:8000']
    metrics_path: 'metrics'

  - job_name: 'auth_service'
    static_configs:
      - targets: ['auth_service:8001']
    metrics_path: 'metrics'

  - job_name: 'user_service'
    static_configs:
      - targets: ['user_service:8002']
    metrics_path: 'metrics'
    
  - job_name: 'complex_service'
    static_configs:
      - targets: ['complex_service:8003']
    metrics_path: 'metrics'

  - job_name: 'poster_service'
    static_configs:
      - targets: ['poster_service:8004']
    metrics_path: 'metrics'