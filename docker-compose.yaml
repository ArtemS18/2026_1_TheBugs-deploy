

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: thebugs
      POSTGRES_PASSWORD: thebugs
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebugs -d main"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/share:/usr/share/nginx/html
      - ./nginx/img:/var/www/media
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    ports:
      - 80:80
      - 443:443 
    depends_on:
      - frontend
      - server

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
        VITE_BASE_URL: ${BASE_URL}
    volumes:
      - ./nginx/share:/app/dist
    
    
  server:
    container_name: server
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV}
      SRV_HOST: 0.0.0.0
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_PWD: ${SMTP_PWD}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLICHOST: ${IMG_URL}
      ES_HOST: elasticsearch

    depends_on:
      - postgres
      - redis
      - elasticsearch
      - minio

    env_file:
      - .env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email rerttdtdf@gmail.com --agree-tos -d dom-deli.ru

  minio: 
    image:
      quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment: 
      MINIO_ACCESS_KEY: admin123
      MINIO_SECRET_KEY: admin123
    command: server /data --console-address ":9001"


  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ALIAS: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin123
      MINIO_SECRET_KEY: admin123
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 admin123 admin123 &&
      mc mb minio/media --ignore-existing &&
      mc anonymous set public minio/media &&
      echo 'Bucket media created and public for download'
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./backend/deploy/elasticsearch/init.sh:/usr/local/bin/init.sh
    command: >
      bash -c "
        /usr/local/bin/docker-entrypoint.sh elasticsearch &
        sleep 30 && 
        bash /usr/local/bin/init.sh &&
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  logstash:
    build: 
      context: ./backend/deploy/logstash
      dockerfile: Dockerfile
    volumes:
      - ./backend/deploy/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - postgres
      - elasticsearch

volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:



