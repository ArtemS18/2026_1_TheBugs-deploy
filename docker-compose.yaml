  #   env_file:
  #     - .env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email rerttdtdf@gmail.com --agree-tos --expand -d dom-deli.ru -d grafana.dom-deli.ru -d support.dom-deli.ru;

  minio: 
    image:
      quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment: 
      MINIO_ACCESS_KEY: admin123
      MINIO_SECRET_KEY: admin123
    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      retries: 5
      timeout: 5s


  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ALIAS: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin123
      MINIO_SECRET_KEY: admin123
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 admin123 admin123 &&
      mc mb minio/media --ignore-existing &&
      mc anonymous set public minio/media &&
      echo 'Bucket media created and public for download'
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./backend/deploy/elasticsearch/init.sh:/usr/local/bin/init.sh
    command: >
      bash -c "
        /usr/local/bin/docker-entrypoint.sh elasticsearch &
        sleep 30 && 
        bash /usr/local/bin/init.sh &&
        wait
      "
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health"]
      interval: 30s 
      timeout: 30s
      retries: 5
      start_period: 60s

  logstash:
    build: 
      context: ./backend/deploy/logstash
      dockerfile: Dockerfile
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx1g
    volumes:
      - ./backend/deploy/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100" 
    volumes:
      - ./backend/deploy/loki/loki-config.yml:/etc/loki/config.yml
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
  
  auth_service:
    build:
      context: backend
      dockerfile: microservice/auth/Dockerfile
    ports:
    - "8001:8001"

    volumes:
      - ./backend/config/config.yaml:/app/config/config.yaml
      - ./backend/private.pem:/app/private.pem
      - ./backend/public.pem:/app/public.pem
    <<: *server-common
    environment:
      APP_ENV: ${APP_ENV}
      SRV_HOST: 0.0.0.0
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_PWD: ${SMTP_PWD}
      LOKI_URL: http://loki:3100
      SRV_PORT: 8001
      SERVICE_NAME: auth_service

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8001/health || exit 1"]
      interval: 10s
      retries: 3
      timeout: 10s

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy

  gateaway_service:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
    - "8000:8000"

    volumes:
      - ./backend/config/config.yaml:/app/config/config.yaml
    <<: *server-common
    environment:
      APP_ENV: ${APP_ENV}
      SRV_HOST: 0.0.0.0
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_PWD: ${SMTP_PWD}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_HOST: ${IMG_URL}
      ES_HOST: elasticsearch
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LOKI_URL: http://loki:3100
      AUTH_SRV_HOST: "auth_service"
      USER_SRV_HOST: "user_service"
      COMPLEX_SRV_HOST: "complex_service"
      POSTER_SRV_HOST: "poster_service"
      SRV_PORT: 8000
      SERVICE_NAME: gateaway_service

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      retries: 3
      timeout: 10s
    depends_on:
      auth_service:
          condition: service_healthy
      user_service:
          condition: service_healthy
      complex_service:
          condition: service_healthy
      poster_service:
          condition: service_healthy


  user_service:
    build:
        context: backend
        dockerfile: microservice/user/Dockerfile
    ports:
    - "8002:8002"

    volumes:
      - ./backend/config/config.yaml:/app/config/config.yaml
    <<: *server-common
    environment:
      APP_ENV: ${APP_ENV}
      SRV_HOST: 0.0.0.0
      SRV_PORT: 8002
      PG_HOST: postgres
      PG_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_HOST: ${IMG_URL}
      LOKI_URL: http://loki:3100
      SERVICE_NAME: user_service

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8002/health || exit 1"]
      interval: 10s
      retries: 3
      timeout: 10s

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy

  complex_service:
    build:
        context: backend
        dockerfile: microservice/complex/Dockerfile
    ports:
    - "8003:8003"

    volumes:
      - ./backend/config/config.yaml:/app/config/config.yaml
    <<: *server-common
    environment:
      APP_ENV: ${APP_ENV}
      SRV_HOST: 0.0.0.0
      SRV_PORT: 8003
      PG_HOST: postgres
      PG_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_HOST: ${IMG_URL}
      LOKI_URL: http://loki:3100
      SERVICE_NAME: complex_service

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8003/health || exit 1"]
      interval: 10s
      retries: 3
      timeout: 10s

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy
    
  poster_service:
    build:
        context: backend
        dockerfile: microservice/poster/Dockerfile
    ports:
    - "8004:8004"

    volumes:
      - ./backend/config/config.yaml:/app/config/config.yaml
    <<: *server-common
    environment:
      APP_ENV: ${APP_ENV}
      SRV_HOST: 0.0.0.0
      SRV_PORT: 8004
      PG_HOST: postgres
      PG_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_HOST: ${IMG_URL}
      LOKI_URL: http://loki:3100
      SERVICE_NAME: poster_service
      ES_HOST: elasticsearch
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8004/health || exit 1"]
      interval: 10s
      retries: 3
      timeout: 10s

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  grafana_data:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
  loki-data:



