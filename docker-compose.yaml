x-server-env: &server-common
  environment:
    APP_ENV: ${APP_ENV}
    SRV_HOST: 0.0.0.0
    PG_HOST: postgres
    PG_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SMTP_PWD: ${SMTP_PWD}
    MINIO_ENDPOINT: minio:9000
    MINIO_PUBLIC_HOST: ${IMG_URL}
    ES_HOST: elasticsearch
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    LOKI_URL: http://loki:3100
    AUTH_SRV_HOST: "auth_service"

  env_file:
      - .env


services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: thebugs
      POSTGRES_PASSWORD: thebugs
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebugs -d main"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/config/whitelist.conf:/etc/nginx/conf.d/whitelist.conf
      - ./nginx/share:/usr/share/nginx/html
      - ./nginx/img:/var/www/media
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    ports:
      - 80:80
      - 443:443 
    depends_on:
      frontend:
        condition: service_started
      gateaway_service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_URL}
        VITE_BASE_URL: ${BASE_URL}
        VITE_SUPPORT_URL: ${SUPPORT_URL}
    volumes:
      - ./nginx/share:/app/dist

  frontend-support:
    build:
      context: ./frontend
      dockerfile: support/Dockerfile
      args:
        VITE_API_URL: ${API_URL}
        VITE_BASE_URL: ${BASE_URL}
    ports:
      - "81:80"
    
    
