

upstream  backend{
    server gateaway_service:8000;
    keepalive 16;
}

upstream  minio{
    server minio:9000;
    keepalive 16;
}

upstream grafana {
    server grafana:3000;
    keepalive 16;
}

upstream support {
    server frontend-support:80;
    keepalive 16;
}

server {
    listen 80;
    server_name dom-deli.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
map $http_authorization $no_cache_auth {
    ""      0;
    default 1;
}
map $request_uri $no_cache_csrf {
    "~*/csrf/" 1;  
    "~*/api/csrf$" 1;
    default 0;
}

map "$no_cache_auth:$no_cache_csrf" $no_cache {
    "0:0" 0;
    default 1;
}

server {
    listen 443 ssl http2;
    server_name dom-deli.ru;

    ssl_certificate /etc/letsencrypt/live/dom-deli.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dom-deli.ru/privkey.pem;

    ignore_invalid_headers off;
    client_max_body_size 0;
    
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "http://gateaway_service:8000";

        proxy_request_buffering off; 
        proxy_buffering off;
        proxy_redirect off;
        proxy_cache_methods GET HEAD;

        proxy_no_cache $no_cache;
        proxy_cache_bypass $no_cache;

        proxy_cache static_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 302 3m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/{
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off; 
        proxy_buffering off;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass http://minio;
    }

    location /adminer/ {
        include /etc/nginx/conf.d/whitelist.conf; 
        deny all;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://adminer:8080;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  
    }
}

server {
    listen 80;
    server_name grafana.dom-deli.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name grafana.dom-deli.ru;

    ssl_certificate /etc/letsencrypt/live/dom-deli.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dom-deli.ru/privkey.pem;

    client_max_body_size 0;

    location / {
        include /etc/nginx/conf.d/whitelist.conf;

        deny all;
        proxy_pass http://grafana;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

