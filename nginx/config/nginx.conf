

upstream  backend{
    server server:8000;
    keepalive 16;
}
server {
    listen 80;
    server_name dom-deli.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    #listen 80;
    server_name dom-deli.ru;

    ssl_certificate /etc/letsencrypt/live/dom-deli.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dom-deli.ru/privkey.pem;
    
    location /api/ {
        resolver 127.0.0.11 valid=10s;

        set $backend_upstream "http://server:8000";


        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;
        proxy_buffering off;
    }

    location /media/{
        alias /var/www/media/;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  
    }
}

