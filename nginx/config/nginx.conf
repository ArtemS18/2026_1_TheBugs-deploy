server {
    listen 443 ssl http2;
    server_name elasticvue.dom-deli.ru;

    ssl_certificate /etc/letsencrypt/live/dom-deli.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dom-deli.ru/privkey.pem;

    client_max_body_size 0;

    location /database/ {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://elasticsearch:9200/; 
    }

    location / {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;
        proxy_pass http://elasticvue:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
